version: 2
# npm: o pnpm exige procedência (trustPolicy); undici-types@6.21.0 está em trustPolicyExclude.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Os tipos acompanham o Node mínimo suportado (22); majors 23+ não se aplicam.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
