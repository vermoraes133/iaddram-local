packages:
  - apps/*
  - packages/*

blockExoticSubdeps: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@biomejs/*"
  - "@esbuild/*"
  - "bare-fs"
  - "nanoid"
trustPolicy: no-downgrade
trustPolicyExclude:
  - "undici-types@6.21.0"
onlyBuiltDependencies:
  - esbuild
overrides:
  "@grpc/grpc-js": "1.14.5"
  "brace-expansion@^2.0.0": "2.1.7"
  "brace-expansion@^5.0.0": "5.0.12"
  "esbuild": "0.28.2"
  "fast-uri@^3.0.0": "3.1.8"
  "fast-uri@^4.0.0": "4.1.5"
  "hono": "4.13.11"
  "nanoid": "3.3.18"
  "source-map-js": "1.2.2"
  "tinypool": "2.2.0"
  "tsx": "4.23.4"
  "undici@^7.0.0": "7.29.1"
  "uuid": "11.1.1"
  "vite@^7.0.0": "7.3.7"
